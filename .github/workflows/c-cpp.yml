name: pwm build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libssl-dev libfido2-dev
    - name: configure
      run: ./configure --with-fido2
    - name: make
      run: make
    - name: make check
      run: make check
    - name: show config.log on failure
      if: failure()
      run: cat config.log
